    <script>
        function unlock() {
            if(document.getElementById('pass').value === '190407') {
                document.getElementById('password-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('password-screen').style.display = 'none';
                    document.getElementById('main-ui').style.display = 'flex';
                }, 600);
            } else { alert('Ошибка доступа'); }
        }

        function updateProgress() {
            const all = document.querySelectorAll('.task');
            const checked = document.querySelectorAll('.task:checked');
            const p = all.length > 0 ? Math.round((checked.length / all.length) * 100) : 0;
            document.getElementById('fill').style.width = p + '%';
            document.getElementById('perc-val').innerText = p;
        }

        function addTask() {
            const input = document.getElementById('new-task-input');
            if (input.value.trim() === "") return;
            
            const div = document.createElement('div');
            div.className = 'task-item';
            div.innerHTML = `<input type="checkbox" class="task"> <span>${input.value}</span>`;
            document.getElementById('task-list').appendChild(div);
            
            div.querySelector('input').addEventListener('change', updateProgress);
            input.value = "";
            updateProgress();
        }

        // Функция для удаления выполненных задач
        function clearCompleted() {
            const checked = document.querySelectorAll('.task:checked');
            checked.forEach(task => task.parentElement.remove());
            updateProgress();
        }

        document.querySelectorAll('.task').forEach(t => t.addEventListener('change', updateProgress));

        // ИСПРАВЛЕННЫЙ ТАЙМЕР (на 2025 год)
        function startTimer() {
            const session = new Date('June 1, 2025').getTime(); // Установлена актуальная дата
            setInterval(() => {
                const now = new Date().getTime();
                const diff = session - now;
                
                if (diff > 0) {
                    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                    document.getElementById('timer').innerText = days + " дн.";
                } else {
                    document.getElementById('timer').innerText = "Сессия идет! 🔥";
                }
            }, 1000);
        }
        startTimer();
    </script>
