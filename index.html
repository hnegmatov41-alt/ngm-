<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя страница и Группа 251-952</title>
    <style>
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            color: white;
            overflow: hidden; /* Скрываем прокрутку, пока нет пароля */
        }

        /* ЭКРАН ПАРОЛЯ В СТИЛЕ МОСКОВСКОГО ПОЛИТЕХА */
        #password-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #002c5f 0%, #e30613 100%); /* Цвета Политеха */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            text-align: center;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            color: #333;
            max-width: 320px;
            width: 90%;
        }
        .login-card h2 { color: #002c5f; margin-bottom: 20px; }
        .login-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .login-card button {
            background: #e30613;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .login-card button:hover { background: #b3050f; }

        /* Остальные ваши стили */
        section { height: 100vh; display: flex; justify-content: center; align-items: center; text-align: center; }
        .slide-1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .slide-2 { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 400px;
        }
        h1 { margin: 0; font-size: 2.5rem; }
        p { font-size: 1.2rem; opacity: 0.9; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background: #fff;
            color: #764ba2;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
        }
    </style>
</head>
<body>

    <!-- ОКНО ВХОДА -->
    <div id="password-screen">
        <div class="login-card">
            <img src="https://mospolytech.ru" alt="Московский Политех" style="width: 100%; margin-bottom: 20px;">
            <h2>Вход для Группы 251-952</h2>
            <input type="password" id="pass-input" placeholder="Введите пароль">
            <button onclick="checkPass()">Войти</button>
            <p id="error-msg" style="color: red; font-size: 0.8rem; display: none; margin-top: 10px;">Неверный пароль!</p>
        </div>
    </div>

    <script>
        function checkPass() {
            var input = document.getElementById("pass-input").value;
            if (input === "190407") {
                document.getElementById("password-screen").style.display = "none";
                document.body.style.overflow = "auto"; // Разрешаем прокрутку
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }
        // Вход по нажатию Enter
        document.getElementById("pass-input").addEventListener("keyup", function(event) {
            if (event.key === "Enter") { checkPass(); }
        });
    </script>

    <!-- ОСНОВНОЙ КОНТЕНТ САЙТА -->
    <section class="slide-1">
        <div class="card">
            <h1>Привет! Я на связи 🚀</h1>
            <p>Это мой первый сайт, созданный на GitHub Pages.</p>
            <a href="#students" class="btn">Группа 251-952 ↓</a>
        </div>
    </section>

    <section id="students" class="slide-2">
        <div class="card">
            <h1>Студенты 251-952</h1>
            <p>Мы учимся создавать сайты и работать с GitHub!</p>
            <a href="https://github.com" class="btn">Наш GitHub</a>
        </div>
    </section>

</body>
</html>
