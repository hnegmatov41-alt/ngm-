<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система Политех | Группа 251-952</title>
    <link rel="icon" href="https://mospolytech.ru" type="image/x-icon">
    <style>
        :root {
            --bg: #0b0e14;
            --card-bg: rgba(23, 27, 34, 0.8);
            --accent: #e30613;
            --accent-glow: rgba(227, 6, 19, 0.3);
            --text: #e6edf3;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0; background: var(--bg); color: var(--text);
            display: flex; min-height: 100vh; overflow-x: hidden;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(227, 6, 19, 0.7); }
            70% { box-shadow: 0 0 20px 10px rgba(227, 6, 19, 0); }
            100% { box-shadow: 0 0 0 0 rgba(227, 6, 19, 0); }
        }
        .urgent { border-color: #ffeb3b !important; animation: pulse-red 2s infinite; }

        #password-screen {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; justify-content: center; align-items: center;
            z-index: 10000; transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .login-box {
            background: var(--card-bg); padding: 40px; border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1); text-align: center; width: 320px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        #main-ui { display: none; width: 100%; height: 100vh; }

        .sidebar {
            width: 260px; background: rgba(13, 17, 23, 0.9);
            border-right: 1px solid rgba(255,255,255,0.05);
            padding: 30px 20px; display: flex; flex-direction: column;
        }

        .dashboard {
            flex: 1; padding: 40px; overflow-y: auto;
            background: radial-gradient(circle at top right, rgba(227,6,19,0.05), transparent);
        }

        .grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .glass-card {
            background: var(--card-bg); border-radius: 20px; padding: 25px;
            border: 1px solid rgba(255,255,255,0.05); transition: 0.3s;
        }
        .glass-card:hover { border-color: var(--accent); }

        .progress-track { height: 6px; background: #21262d; border-radius: 3px; margin: 15px 0; }
        .progress-bar { height: 100%; background: var(--accent); border-radius: 3px; width: 0%; transition: 1s; }

        .btn-action {
            background: var(--accent); color: white; border: none; padding: 12px;
            border-radius: 12px; cursor: pointer; width: 100%; font-weight: 600;
            text-decoration: none; display: block; text-align: center; margin-top: 10px;
        }

        input {
            background: #0d1117; border: 1px solid #30363d; color: white;
            padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px;
        }

        .task-item { display: flex; gap: 10px; margin: 8px 0; font-size: 14px; align-items: center; }
        .task-item input[type="checkbox"] { width: auto; margin: 0; cursor: pointer; accent-color: var(--accent); }

        .tag { font-size: 11px; text-transform: uppercase; color: var(--accent); font-weight: bold; letter-spacing: 1px; }

        .stat-circle {
            width: 80px; height: 80px; border-radius: 50%;
            border: 4px solid #4caf50; display: flex;
            justify-content: center; align-items: center;
            font-weight: bold; margin: 10px auto; color: #4caf50;
        }
        
        .counter-btn {
            background: #21262d; color: white; border: 1px solid #30363d;
            width: 30px; height: 30px; border-radius: 5px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="password-screen">
        <div class="login-box">
            <img src="https://mospolytech.ru" style="filter: brightness(0) invert(1); width: 150px; margin-bottom: 20px;">
            <h2 style="margin:0">ИТ-Доступ</h2>
            <input type="password" id="pass" placeholder="Пароль: 190407">
            <button class="btn-action" onclick="unlock()">Авторизоваться</button>
        </div>
    </div>

    <div id="main-ui">
        <div class="sidebar">
            <div class="tag" style="margin-bottom: 20px;">University OS</div>
            <div style="font-weight: 700; font-size: 20px;">Политех <span style="color: var(--accent);">ИТ</span></div>
            <nav style="margin-top: 40px; display: flex; flex-direction: column; gap: 15px;">
                <div style="color: var(--accent); font-weight: bold;">● Главная</div>
                <div style="opacity: 0.5;">○ Мои проекты</div>
            </nav>
        </div>

        <main class="dashboard">
            <div class="header">
                <div class="tag">Панель управления студента</div>
                <h1>Кабинет группы 251-952</h1>
            </div>

            <div class="grid">
                <!-- 1. ЗАДАЧИ СЕМЕСТРА -->
                <div class="glass-card">
                    <span class="tag">Успеваемость</span>
                    <h3>Задачи семестра</h3>
                    <div style="font-size: 24px; font-weight: 700;"><span id="perc-val">0</span>%</div>
                    <div class="progress-track"><div class="progress-bar" id="fill"></div></div>
                    
                    <div id="task-list">
                        <div class="task-item"><input type="checkbox" class="task" onchange="updateProgress()"> Веб-технологии</div>
                        <div class="task-item"><input type="checkbox" class="task" onchange="updateProgress()"> Программирование</div>
                    </div>

                    <div style="margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
                        <input type="text" id="new-task-input" placeholder="Новая задача...">
                        <button class="btn-action" style="background: #21262d;" onclick="addTask()">+ Добавить</button>
                        <button class="btn-action" style="background: transparent; border: 1px solid var(--accent); color: var(--accent); font-size: 11px;" onclick="clearCompleted()">Удалить выполненные</button>
                    </div>
                </div>

                <!-- 2. ПОСЕЩЕНИЕ -->
                <div class="glass-card">
                    <span class="tag">Мониторинг</span>
                    <h3>Посещение</h3>
                    <div class="stat-circle" id="attend-percent">100%</div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                        <span>Пропуски: <b id="missed-count" style="color: var(--accent)">0</b></span>
                        <div style="display: flex; gap: 5px;">
                            <button class="counter-btn" onclick="changeCounter(-1)">-</button>
                            <button class="counter-btn" onclick="changeCounter(1)">+</button>
                        </div>
                    </div>
                </div>

                <!-- 3. ТАЙМЕР -->
                <div class="glass-card" id="timer-card">
                    <span class="tag">Временная шкала</span>
                    <h3>До сессии (01.06.2026)</h3>
                    <div id="timer" style="font-size: 22px; font-weight: 800; color: var(--accent); margin: 15px 0;">Загрузка...</div>
                    <p style="font-size: 11px; opacity: 0.5;">Расчет по месяцам и дням.</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        let missed = 0;

        function unlock() {
            if(document.getElementById('pass').value === '190407') {
                document.getElementById('password-screen').style.display = 'none';
                document.getElementById('main-ui').style.display = 'flex';
                startTimer();
                updateProgress(); // Считаем начальные %
            } else { alert('Доступ закрыт!'); }
        }

        // Логика задач
        function updateProgress() {
            const all = document.querySelectorAll('.task');
            const checked = document.querySelectorAll('.task:checked');
            const p = all.length > 0 ? Math.round((checked.length / all.length) * 100) : 0;
            document.getElementById('fill').style.width = p + '%';
            document.getElementById('perc-val').innerText = p;
        }

        function addTask() {
            const input = document.getElementById('new-task-input');
            if (input.value.trim() === "") return;
            const div = document.createElement('div');
            div.className = 'task-item';
            div.innerHTML = `<input type="checkbox" class="task" onchange="updateProgress()"> ${input.value}`;
            document.getElementById('task-list').appendChild(div);
            input.value = "";
            updateProgress();
        }

        function clearCompleted() {
            document.querySelectorAll('.task:checked').forEach(t => t.parentElement.remove());
            updateProgress();
        }

        // Посещаемость
        function changeCounter(v) {
            missed = Math.max(0, missed + v);
            document.getElementById('missed-count').innerText = missed;
            let p = Math.max(0, 100 - (missed * 5));
            document.getElementById('attend-percent').innerText = p + '%';
        }

        // Таймер
        function startTimer() {
            const target = new Date('June 1, 2026 00:00:00').getTime();
            setInterval(() => {
                const now = new Date();
                const diff = target - now.getTime();
                
                const dTotal = Math.floor(diff / (1000 * 60 * 60 * 24));
                const months = Math.floor(dTotal / 30.44); 
                const days = Math.floor(dTotal % 30.44);
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);

                document.getElementById('timer').innerHTML = `${months} мес. ${days} дн. ${hours} ч.`;
                
                if (dTotal < 10) document.getElementById('timer-card').classList.add('urgent');
            }, 1000);
        }

        document.getElementById('pass').addEventListener('keypress', (e) => { if(e.key === 'Enter') unlock(); });
    </script>
</body>
</html>
