<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Московский Политех | 251-952</title>
    <link rel="icon" href="https://mospolytech.ru" type="image/x-icon">
    
    <style>
        :root { --poly-red: #e30613; --poly-blue: #002c5f; }
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0; color: white; background: #001529;
            min-height: 100vh; overflow-x: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        /* ЖИВОЙ ФОН */
        .bg-blobs { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #001529; }
        .blob { position: absolute; width: 500px; height: 500px; background: var(--poly-red); filter: blur(90px); border-radius: 50%; opacity: 0.15; animation: move 25s infinite alternate; }
        .blob.blue { background: var(--poly-blue); right: -100px; bottom: -100px; animation-duration: 30s; }
        @keyframes move { from { transform: translate(-10%, -10%); } to { transform: translate(80%, 80%); } }

        /* ЭКРАН ПАРОЛЯ */
        #password-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 21, 41, 0.95); backdrop-filter: blur(25px);
            display: flex; justify-content: center; align-items: center; z-index: 10000; transition: 0.8s;
        }
        .login-card { background: white; padding: 40px; border-radius: 30px; color: #333; max-width: 320px; width: 90%; text-align: center; }

        /* КОНТЕНТ */
        #content { display: none; flex-wrap: wrap; justify-content: center; gap: 25px; padding: 40px; z-index: 1; }
        .card {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 25px;
            padding: 30px; width: 300px; transition: 0.4s ease;
        }
        .card:hover { transform: translateY(-10px); border-color: var(--poly-red); box-shadow: 0 15px 40px rgba(227, 6, 19, 0.2); }

        /* ПЛЕЕР В УГЛУ */
        #music-control {
            position: fixed; bottom: 20px; right: 20px;
            background: rgba(255,255,255,0.1); border-radius: 50%;
            width: 45px; height: 45px; display: none;
            justify-content: center; align-items: center; cursor: pointer; z-index: 1000;
        }

        button { width: 100%; padding: 14px; margin-top: 15px; border-radius: 12px; border: none; background: var(--poly-red); color: white; font-weight: bold; cursor: pointer; }
        input { width: 100%; padding: 14px; margin-top: 15px; border-radius: 12px; border: 1px solid #ddd; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="bg-blobs">
        <div class="blob"></div>
        <div class="blob blue"></div>
    </div>

    <!-- Музыкальный элемент (Lo-Fi поток) -->
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com" type="audio/mpeg">
    </audio>

    <div id="music-control" onclick="toggleMusic()">🎵</div>

    <div id="password-screen">
        <div class="login-card">
            <img src="https://mospolytech.ru" style="width:120px;">
            <h2 style="color:var(--poly-blue); margin-bottom:5px;">ИТ-Вход</h2>
            <p style="font-size:0.8rem; color:#666;">Введите 190407 для активации</p>
            <input type="password" id="pass" placeholder="Пароль">
            <button onclick="unlock()">Войти и включить музыку</button>
        </div>
    </div>

    <div id="content">
        <div class="card">
            <h2 style="color:var(--poly-red)">🎯 Мой Семестр</h2>
            <p>Дисциплина — это ключ к успеху в ИТ. <br> Не забывай проверять свои цели!</p>
        </div>
        <div class="card">
            <h2>🎓 Политех</h2>
            <p>Группа 251-952 <br> На связи 24/7</p>
        </div>
    </div>

    <script>
        const audio = document.getElementById('bg-music');
        
        function unlock() {
            if(document.getElementById('pass').value === '190407') {
                // Прячем экран пароля
                document.getElementById('password-screen').style.opacity = '0';
                
                // Запускаем музыку
                audio.volume = 0.3;
                audio.play().catch(e => console.log("Нужен клик для музыки"));

                setTimeout(() => {
                    document.getElementById('password-screen').style.display = 'none';
                    document.getElementById('content').style.display = 'flex';
                    document.getElementById('music-control').style.display = 'flex';
                }, 800);
            } else { alert('Неверно!'); }
        }

        function toggleMusic() {
            if (audio.paused) { audio.play(); } 
            else { audio.pause(); }
        }

        document.getElementById("pass").addEventListener("keyup", (e) => { if (e.key === "Enter") unlock(); });
    </script>
</body>
</html>
