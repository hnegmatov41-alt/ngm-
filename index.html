<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система Политех | Группа 251-952</title>
    <style>
        :root {
            --bg: #0b0e14;
            --card-bg: rgba(23, 27, 34, 0.8);
            --accent: #e30613;
            --text: #e6edf3;
            --green: #4caf50;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0; background: var(--bg); color: var(--text);
            display: flex; min-height: 100vh; overflow-x: hidden;
        }

        #password-screen {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; justify-content: center; align-items: center;
            z-index: 10000; transition: 0.6s;
        }

        .login-box {
            background: var(--card-bg); padding: 40px; border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1); text-align: center; width: 320px;
        }

        #main-ui { display: none; width: 100%; height: 100vh; }

        .sidebar {
            width: 260px; background: rgba(13, 17, 23, 0.9);
            border-right: 1px solid rgba(255,255,255,0.05);
            padding: 30px 20px; display: flex; flex-direction: column;
        }

        .dashboard { flex: 1; padding: 40px; overflow-y: auto; }

        .grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .glass-card {
            background: var(--card-bg); border-radius: 20px; padding: 25px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .btn-action {
            background: var(--accent); color: white; border: none; padding: 12px;
            border-radius: 12px; cursor: pointer; width: 100%; font-weight: 600; margin-top: 10px;
        }

        .counter-btn {
            background: #21262d; color: white; border: none;
            width: 30px; height: 30px; border-radius: 5px; cursor: pointer;
        }

        input {
            background: #0d1117; border: 1px solid #30363d; color: white;
            padding: 12px; border-radius: 8px; width: 100%; margin-bottom: 10px;
        }

        .tag { font-size: 11px; text-transform: uppercase; color: var(--accent); font-weight: bold; }
        
        #timer { font-size: 22px; font-weight: 800; color: var(--accent); margin: 15px 0; line-height: 1.4; }

        .stat-circle {
            width: 80px; height: 80px; border-radius: 50%;
            border: 4px solid var(--green); display: flex;
            justify-content: center; align-items: center;
            font-weight: bold; margin: 10px auto; color: var(--green);
        }
    </style>
</head>
<body>

    <div id="password-screen">
        <div class="login-box">
            <img src="https://mospolytech.ru" style="filter: brightness(0) invert(1); width: 150px; margin-bottom: 20px;">
            <input type="password" id="pass" placeholder="Пароль">
            <button class="btn-action" onclick="unlock()">Войти</button>
        </div>
    </div>

    <div id="main-ui">
        <aside class="sidebar">
            <div class="tag">University OS</div>
            <h2>Политех ИТ</h2>
            <nav style="margin-top: 20px; display: flex; flex-direction: column; gap: 15px;">
                <div>● Главная</div>
                <div style="opacity: 0.5;">○ Проекты</div>
            </nav>
        </aside>

        <main class="dashboard">
            <h1>Кабинет 251-952</h1>
            <div class="grid">
                <!-- 1. ЗАДАЧИ -->
                <div class="glass-card">
                    <span class="tag">Задачи</span>
                    <div id="task-list" style="margin-top: 15px;">
                        <label><input type="checkbox" onchange="saveData()"> Веб-технологии</label><br>
                        <label><input type="checkbox" onchange="saveData()"> Программирование</label>
                    </div>
                </div>

                <!-- 2. ПОСЕЩЕНИЕ -->
                <div class="glass-card">
                    <span class="tag">Посещение</span>
                    <div class="stat-circle" id="attend-percent">100%</div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span>Пропуски: <b id="missed-val">0</b></span>
                        <div>
                            <button class="counter-btn" onclick="changeM(-1)">-</button>
                            <button class="counter-btn" onclick="changeM(1)">+</button>
                        </div>
                    </div>
                </div>

                <!-- 3. ТОЧНЫЙ ТАЙМЕР -->
                <div class="glass-card">
                    <span class="tag">Временная шкала</span>
                    <h3>До сессии (01.06.2026)</h3>
                    <div id="timer">Загрузка...</div>
                    <p style="font-size: 12px; opacity: 0.5;">Расчет: Месяцы / Дни / Часы</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        let missed = localStorage.getItem('missed') ? parseInt(localStorage.getItem('missed')) : 0;

        function unlock() {
            if(document.getElementById('pass').value === '190407') {
                document.getElementById('password-screen').style.display = 'none';
                document.getElementById('main-ui').style.display = 'flex';
                updateAttend();
                startTimer();
            } else { alert('Ошибка'); }
        }

        function changeM(v) {
            missed = Math.max(0, missed + v);
            localStorage.setItem('missed', missed);
            updateAttend();
        }

        function updateAttend() {
            document.getElementById('missed-val').innerText = missed;
            let p = Math.max(0, 100 - missed * 2);
            document.getElementById('attend-percent').innerText = p + '%';
        }

        function startTimer() {
            const target = new Date('June 1, 2026 00:00:00');
            
            setInterval(() => {
                const now = new Date();
                const diff = target - now;

                if (diff <= 0) {
                    document.getElementById('timer').innerText = "Сессия началась!";
                    return;
                }

                // Расчет месяцев, дней, часов
                let months = (target.getFullYear() - now.getFullYear()) * 12 + (target.getMonth() - now.getMonth());
                let tempDate = new Date(now);
                tempDate.setMonth(now.getMonth() + months);
                
                if (tempDate > target) {
                    months--;
                    tempDate = new Date(now);
                    tempDate.setMonth(now.getMonth() + months);
                }

                const days = Math.floor((target - tempDate) / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);

                document.getElementById('timer').innerHTML = 
                    `${months} мес. ${days} дн.<br>${hours} ч.`;
            }, 1000);
        }
    </script>
</body>
</html>
