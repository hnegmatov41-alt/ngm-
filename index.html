<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя страница и Группа 251-952</title>
    <style>
        html { scroll-behavior: smooth; } /* Плавная прокрутка */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            color: white;
        }
        /* Общие стили для секций (слайдов) */
        section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        /* Первый слайд (Ваш код) */
        .slide-1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        /* Второй слайд (Для студентов 251-952) */
        .slide-2 {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 400px;
        }
        h1 { margin: 0; font-size: 2.5rem; }
        p { font-size: 1.2rem; opacity: 0.9; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background: #fff;
            color: #764ba2;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .btn-second { color: #1e3c72; }
    </style>
</head>
<body>

    <!-- ПЕРВЫЙ СЛАЙД (Ваш оригинал) -->
    <section class="slide-1">
        <div class="card">
            <h1>Привет! Я на связи 🚀</h1>
            <p>Это мой первый сайт, созданный на GitHub Pages.</p>
            <a href="#students" class="btn">Группа 251-952 ↓</a>
        </div>
    </section>

    <!-- ВТОРОЙ СЛАЙД (Студенты 251-952) -->
    <section id="students" class="slide-2">
        <div class="card">
            <h1>Студенты 251-952</h1>
            <p>Мы учимся создавать сайты и работать с GitHub!</p>
            <a href="https://github.com" class="btn btn-second">Наш GitHub</a>
            <br><br>
            <a href="#" style="color: white; font-size: 0.9rem; opacity: 0.6;">Вернуться наверх ↑</a>
        </div>
    </section>

</body>
</html>
