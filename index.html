<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polytech OS | Группа 251-952</title>
    <style>
        :root {
            --bg: #0a192f; /* Глубокий темно-синий */
            --card-bg: rgba(16, 33, 62, 0.8);
            --accent: #e30613;
            --text: #e6edf3;
            --yellow: #ffeb3b;
            --sidebar-bg: #071224;
        }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }
        
        /* ЭКРАН ПАРОЛЯ */
        #password-screen { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .login-box { background: var(--card-bg); padding: 40px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); text-align: center; width: 280px; }
        
        /* ОСНОВНОЙ ИНТЕРФЕЙС */
        #main-ui { display: none; width: 100%; flex-direction: row; }
        .sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid rgba(255,255,255,0.05); padding: 30px 20px; flex-shrink: 0; }
        .dashboard { flex: 1; padding: 30px; overflow-y: auto; }
        
        /* СЕТКА С ФИКСИРОВАННЫМ РАЗМЕРОМ */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
            grid-auto-rows: 1fr; /* Все карточки в ряду одной высоты */
        }
        .glass-card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            padding: 25px; 
            border: 1px solid rgba(255,255,255,0.05); 
            display: flex; 
            flex-direction: column;
            justify-content: space-between;
        }
        .full-width { grid-column: 1 / -1; height: auto; }

        .tag { font-size: 11px; text-transform: uppercase; color: var(--accent); font-weight: bold; letter-spacing: 1px; margin-bottom: 10px; display: block; }
        
        /* РАСПИСАНИЕ */
        .week-container { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px; }
        .day-column { min-width: 250px; background: rgba(255,255,255,0.02); padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .day-name { color: var(--yellow); font-weight: bold; margin-bottom: 10px; display: block; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sch-item { display: flex; justify-content: space-between; padding: 8px; border-radius: 8px; margin-bottom: 5px; font-size: 12px; background: rgba(255,255,255,0.03); }

        .btn-action { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: 600; margin-top: 15px; }
        input { background: #0d1117; border: 1px solid #30363d; color: white; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box; font-size: 16px; }

        /* МОБИЛЬНАЯ АДАПТАЦИЯ */
        @media (max-width: 768px) { 
            #main-ui { flex-direction: column; } 
            .sidebar { width: 100%; box-sizing: border-box; } 
            .grid { grid-auto-rows: auto; }
            .dashboard { padding: 15px; }
        }
    </style>
</head>
<body>

    <div id="password-screen">
        <div class="login-box">
            <h2 style="margin-bottom: 20px;">Polytech OS</h2>
            <input type="password" id="pass" placeholder="Пароль: 190407" inputmode="numeric">
            <button class="btn-action" onclick="unlock()">Войти</button>
        </div>
    </div>

    <div id="main-ui">
        <aside class="sidebar">
            <div class="tag">University</div>
            <h2 style="margin: 5px 0">Политех <span style="color:var(--accent)">ИТ</span></h2>
            <p style="opacity: 0.6; font-size: 14px;">Группа 251-952</p>
        </aside>

        <main class="dashboard">
            <div class="grid">
                <!-- ПОЛНОЕ РАСПИСАНИЕ -->
                <div class="glass-card full-width">
                    <span class="tag">Учебный план</span>
                    <div class="week-container" id="week-schedule"></div>
                </div>

                <!-- ДИСЦИПЛИНА -->
                <div class="glass-card">
                    <div>
                        <span class="tag">Дисциплина</span>
                        <h3 style="margin:0">Пропуски занятий</h3>
                    </div>
                    <div style="font-size: 48px; font-weight: bold; text-align: center; color: var(--accent); margin: 20px 0;" id="m-count">0</div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-action" style="background:#21262d" onclick="changeM(-1)">-</button>
                        <button class="btn-action" onclick="changeM(1)">+</button>
                    </div>
                </div>

                <!-- ОБРАТНЫЙ ОТСЧЕТ -->
                <div class="glass-card">
                    <div>
                        <span class="tag">Обратный отсчет</span>
                        <h3 style="margin:0">До 01.06.2026</h3>
                    </div>
                    <div id="timer" style="font-size: 22px; font-weight: bold; color:var(--accent); text-align: center; margin: 20px 0;">Загрузка...</div>
                    <a href="https://lk.mospolytech.ru" target="_blank" style="text-decoration:none;">
                        <button class="btn-action">Личный кабинет</button>
                    </a>
                </div>
            </div>
        </main>
    </div>

    <script>
        const weekData = {
            1: { n: "Пн", p: [{t: "12:20-13:50", n: "Проектная деят. (Пр)"}] },
            2: { n: "Вт", p: [{t: "09:00-10:30", n: "Языки прогр. (Лаб)"},{t: "10:40-12:10", n: "Языки прогр. (Лаб)"},{t: "12:20-13:50", n: "Иностр. язык (Пр)"}] },
            3: { n: "Ср", p: [{t: "09:00-10:30", n: "Мат. анализ (Лек)"},{t: "10:40-12:10", n: "Теор. вероятн. (Пр)"},{t: "12:20-13:50", n: "Мат. анализ (Пр)"}] },
            4: { n: "Чт", p: [{t: "10:40-12:10", n: "Технол. прогр. (Лаб)"},{t: "12:20-13:50", n: "Сети / БД (Лаб)"},{t: "14:30-16:00", n: "Сети / БД (Лаб)"}] },
            5: { n: "Пт", p: [{t: "09:00-10:30", n: "Технол. прогр. (Лек)"},{t: "10:40-12:10", n: "Тех. тексты (Лек)"},{t: "12:20-13:50", n: "Теор. вероятн. (Лек)"},{t: "14:30-16:00", n: "Языки прогр. (Лек)"}] },
            6: { n: "Сб", p: [{t: "10:40-12:10", n: "Физкультура (Пр)"},{t: "12:20-13:50", n: "Базы данных (Лек)"},{t: "14:30-16:00", n: "Сети и системы (Лек)"}] }
        };

        function unlock() {
            if(document.getElementById('pass').value === '190407') {
                document.getElementById('password-screen').style.display = 'none';
                document.getElementById('main-ui').style.display = 'flex';
                renderSchedule();
                startTimer();
            } else { alert('Неверный пароль!'); }
        }

        function renderSchedule() {
            const container = document.getElementById('week-schedule');
            container.innerHTML = '';
            for (let d in weekData) {
                const day = weekData[d];
                let html = `<div class="day-column"><span class="day-name">${day.n}</span>`;
                day.p.forEach(p => {
                    html += `<div class="sch-item"><span style="opacity:0.6">${p.t}</span><b>${p.n}</b></div>`;
                });
                html += `</div>`;
                container.innerHTML += html;
            }
        }

        let missed = 0;
        function changeM(v) { missed = Math.max(0, missed + v); document.getElementById('m-count').innerText = missed; }

        function startTimer() {
            const target = new Date("June 1, 2026").getTime();
            setInterval(() => {
                const diff = target - new Date().getTime();
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById('timer').innerText = d + "д " + h + "ч до сессии";
            }, 1000);
        }
    </script>
</body>
</html>
