<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polytech OS | Группа 251-952</title>
    <link rel="icon" href="https://mospolytech.ru" type="image/x-icon">
    <style>
        :root {
            --bg: #0b0e14;
            --card-bg: rgba(23, 27, 34, 0.9);
            --accent: #e30613;
            --text: #e6edf3;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0; background: var(--bg); color: var(--text);
            display: flex; min-height: 100vh; overflow-x: hidden;
        }

        /* ЭКРАН ВХОДА */
        #password-screen {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; justify-content: center; align-items: center;
            z-index: 10000; transition: 0.6s;
        }
        .login-box {
            background: var(--card-bg); padding: 40px; border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1); text-align: center; width: 320px;
        }

        /* САЙДБАР */
        .sidebar {
            width: 260px; background: #0d1117;
            border-right: 1px solid rgba(255,255,255,0.05);
            padding: 30px 20px; display: flex; flex-direction: column;
            transition: 0.3s; z-index: 999;
        }

        /* МОБИЛЬНОЕ МЕНЮ (БУРГЕР) */
        .menu-toggle {
            display: none; position: fixed; top: 20px; right: 20px;
            background: var(--accent); color: white; border: none;
            width: 45px; height: 45px; border-radius: 10px; z-index: 1000; cursor: pointer;
        }

        /* ОСНОВНОЙ КОНТЕНТ */
        .dashboard { flex: 1; padding: 40px; transition: 0.3s; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }

        .glass-card {
            background: var(--card-bg); border-radius: 20px; padding: 25px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* КНОПКИ И ИНПУТЫ */
        .btn-action {
            background: var(--accent); color: white; border: none; padding: 12px;
            border-radius: 10px; cursor: pointer; width: 100%; font-weight: 600; margin-top: 10px;
        }
        input {
            background: #161b22; border: 1px solid #30363d; color: white;
            padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px;
        }

        /* ТАЙМЕР И ПРОГРЕСС */
        .progress-track { height: 6px; background: #21262d; border-radius: 3px; margin: 15px 0; }
        .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: 1s; }
        .tag { font-size: 11px; text-transform: uppercase; color: var(--accent); font-weight: bold; }

        /* АДАПТИВНОСТЬ ПОД ТЕЛЕФОН */
        @media (max-width: 768px) {
            .menu-toggle { display: block; } /* Показываем кнопку меню */
            .sidebar {
                position: fixed; left: -260px; height: 100vh;
            }
            .sidebar.active { left: 0; } /* Выезжает при клике */
            .dashboard { padding: 80px 20px 20px 20px; }
            .grid { grid-template-columns: 1fr; }
        }

        #music-btn {
            position: fixed; bottom: 20px; left: 20px; background: var(--card-bg);
            border: 1px solid var(--accent); border-radius: 50%; width: 40px; height: 40px;
            display: none; justify-content: center; align-items: center; cursor: pointer;
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop><source src="https://www.soundhelix.com"></audio>
    <div id="music-btn" onclick="toggleMusic()">🎵</div>
    
    <button class="menu-toggle" id="menuBtn">☰</button>

    <div id="password-screen">
        <div class="login-box">
            <img src="https://mospolytech.ru" style="filter: brightness(0) invert(1); width: 120px; margin-bottom: 20px;">
            <h2 style="margin:0">ИТ-Доступ</h2>
            <input type="password" id="pass" placeholder="Пароль: 190407">
            <button class="btn-action" onclick="unlock()">Войти</button>
        </div>
    </div>

    <div id="main-ui" style="display:none; width: 100%;">
        <aside class="sidebar" id="sidebar">
            <div class="tag">University OS</div>
            <h2 style="font-size: 20px;">Политех <span style="color:var(--accent)">ИТ</span></h2>
            <nav style="margin-top: 30px; display:flex; flex-direction:column; gap:15px;">
                <div style="color:var(--accent); font-weight:bold;">● Главная</div>
                <div style="opacity:0.5">○ Мои проекты</div>
                <div style="opacity:0.5">○ База знаний</div>
            </nav>
        </aside>

        <main class="dashboard">
            <div style="margin-bottom: 30px;">
                <div class="tag">Панель студента</div>
                <h1 style="margin:5px 0;">Кабинет 251-952</h1>
            </div>

            <div class="grid">
