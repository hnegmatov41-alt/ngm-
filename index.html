<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Московский Политех | Группа 251-952</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            color: white;
            background-color: #002c5f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ЭКРАН ПАРОЛЯ */
        #password-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #002c5f 0%, #e30613 100%);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .login-card { 
            background: white; padding: 40px; border-radius: 20px; 
            color: #333; max-width: 350px; width: 90%; text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }
        
        /* СТИЛЬ ЛОГОТИПА */
        .polytech-logo {
            width: 120px; /* Размер логотипа */
            margin-bottom: 15px;
        }

        .login-card input { 
            width: 100%; padding: 12px; margin: 20px 0; 
            border: 2px solid #eee; border-radius: 10px; font-size: 1rem;
            box-sizing: border-box;
        }
        .login-card button { 
            background: #e30613; color: white; border: none; 
            padding: 12px; border-radius: 10px; cursor: pointer; 
            width: 100%; font-weight: bold; font-size: 1rem;
        }

        /* КОНТЕНТ */
        #content {
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            padding: 40px 20px;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 25px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 300px;
            text-align: center;
            transition: all 0.4s ease;
        }
        .card:hover { transform: translateY(-15px); border-color: #e30613; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #fff;
            color: #002c5f;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
        }
        .card-red { background: linear-gradient(135deg, #e30613 0%, #900 100%); }
    </style>
</head>
<body>

    <!-- ВХОД С ЛОГОТИПОМ -->
    <div id="password-screen">
        <div class="login-card">
            <!-- Логотип Московского Политеха -->
            <img src="https://mospolytech.ru" alt="Логотип Политех" class="polytech-logo">
            
            <div style="font-weight: bold; color: #e30613; font-size: 1rem; letter-spacing: 1px;">МОСКОВСКИЙ ПОЛИТЕХ</div>
            <h3 style="margin: 5px 0 0 0; color: #002c5f;">Личный кабинет 251-952</h3>
            
            <input type="password" id="pass-input" placeholder="Введите пароль">
            <button onclick="checkPass()">Войти</button>
            <p id="error-msg" style="color: red; display: none; font-size: 0.8rem; margin-top: 10px;">Неверный пароль!</p>
        </div>
    </div>

    <!-- САЙТ (Появляется после пароля) -->
    <div id="content">
        <div class="card">
            <div style="font-size: 3rem;">👨‍💻</div>
            <h2>Мой Профиль</h2>
            <p>Первый проект на GitHub Pages.</p>
            <a href="#" class="btn">Настройки</a>
        </div>

        <div class="card card-red">
            <div style="font-size: 3rem;">🎓</div>
            <h2>Группа 251-952</h2>
            <p>Информационные технологии в Политехе.</p>
            <a href="https://mospolytech.ru" target="_blank" class="btn" style="color: #e30613;">Сайт Политеха</a>
        </div>

        <div class="card">
            <div style="font-size: 3rem;">📅</div>
            <h2>Расписание</h2>
            <p>Здесь скоро появятся важные пары.</p>
            <a href="#" class="btn">Открыть</a>
        </div>
    </div>

    <script>
        function checkPass() {
            var input = document.getElementById("pass-input").value;
            if (input === "190407") {
                document.getElementById("password-screen").style.display = "none";
                document.getElementById("content").style.display = "flex";
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }
        document.getElementById("pass-input").addEventListener("keyup", function(e) {
            if (e.key === "Enter") checkPass();
        });
    </script>

</body>
</html>
