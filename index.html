<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polytech OS | Группа 251-952</title>
    <style>
        :root {
            --bg: #0b0e14;
            --card-bg: rgba(23, 27, 34, 0.8);
            --accent: #e30613;
            --text: #e6edf3;
        }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; }
        #password-screen { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 10000; transition: 0.6s; }
        .login-box { background: var(--card-bg); padding: 40px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); text-align: center; width: 320px; }
        #main-ui { display: none; width: 100%; height: 100vh; }
        .sidebar { width: 260px; background: rgba(13, 17, 23, 0.9); border-right: 1px solid rgba(255,255,255,0.05); padding: 30px 20px; display: flex; flex-direction: column; }
        .dashboard { flex: 1; padding: 40px; overflow-y: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .glass-card { background: var(--card-bg); border-radius: 20px; padding: 25px; border: 1px solid rgba(255,255,255,0.05); }
        .tag { font-size: 11px; text-transform: uppercase; color: var(--accent); font-weight: bold; }
        
        /* СТИЛИ РАСПИСАНИЯ */
        .sch-item { display: flex; justify-content: space-between; padding: 12px; border-radius: 12px; margin-bottom: 8px; font-size: 13px; background: rgba(255,255,255,0.03); border: 1px solid transparent; }
        .current-para { background: var(--accent) !important; border-color: #ffeb3b; box-shadow: 0 0 15px rgba(227, 6, 19, 0.4); font-weight: bold; }
        .time-label { color: #ffeb3b; font-weight: bold; margin-left: 10px; min-width: 85px; text-align: right; }
        .day-title { color: var(--accent); margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }

        .btn-action { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 12px; cursor: pointer; width: 100%; font-weight: 600; margin-top: 10px; }
        input { background: #0d1117; border: 1px solid #30363d; color: white; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="password-screen">
        <div class="login-box">
            <img src="https://mospolytech.ru" style="filter: brightness(0) invert(1); width: 150px; margin-bottom: 20px;">
            <input type="password" id="pass" placeholder="Пароль">
            <button class="btn-action" onclick="unlock()">Войти</button>
        </div>
    </div>

    <div id="main-ui">
        <aside class="sidebar">
            <div class="tag">University OS</div>
            <h2>Политех <span style="color:var(--accent)">ИТ</span></h2>
            <nav style="margin-top: 30px; display:flex; flex-direction:column; gap:15px;">
                <div style="color:var(--accent); font-weight:bold;">● Сегодня</div>
                <div style="opacity:0.5">○ Все расписание</div>
            </nav>
        </aside>

        <main class="dashboard">
            <h1>Кабинет 251-952</h1>
            <div class="grid">
                
                <!-- КАРТОЧКА РАСПИСАНИЯ -->
                <div class="glass-card" style="grid-column: span 1;">
                    <span class="tag">Учебный план</span>
                    <h3 id="display-day" class="day-title">Загрузка...</h3>
                    <div id="schedule-list">
                        <!-- Сюда скрипт вставит пары -->
                    </div>
                </div>

                <!-- ТАЙМЕР СЕССИИ -->
                <div class="glass-card">
                    <span class="tag">Дедлайн</span>
                    <h3>До 01.06.2026</h3>
                    <div id="timer" style="font-size: 24px; font-weight: 800; color:var(--accent); margin:15px 0;">...</div>
                    <a href="https://lk.mospolytech.ru" target="_blank" class="btn-action">Личный кабинет Политеха</a>
                </div>

            </div>
        </main>
    </div>

    <script>
        const fullSchedule = {
            1: { name: "Понедельник", pairs: [{t: "12:20-13:50", n: "Проектная деятельность (Пр)"}] },
            2: { name: "Вторник", pairs: [
                {t: "09:00-10:30", n: "Языки программирования (Лаб)"},
                {t: "10:40-12:10", n: "Языки программирования (Лаб)"},
                {t: "12:20-13:50", n: "Иностранный язык (Пр)"}
            ]},
            3: { name: "Среда", pairs: [
                {t: "09:00-10:30", n: "Мат. анализ (Лек)"},
                {t: "10:40-12:10", n: "Теория вероятностей (Пр)"},
                {t: "12:20-13:50", n: "Мат. анализ (Пр)"}
            ]},
            4: { name: "Четверг", pairs: [
                {t: "10:40-12:10", n: "Технологии программирования (Лаб)"},
                {t: "12:20-13:50", n: "Сети / БД (Лаб)"},
                {t: "14:30-16:00", n: "Сети / БД (Лаб)"}
            ]},
            5: { name: "Пятница", pairs: [
                {t: "09:00-10:30", n: "Технологии программирования (Лек)"},
                {t: "10:40-12:10", n: "Тех. тексты и документация (Лек)"},
                {t: "12:20-13:50", n: "Теория вероятностей (Лек)"},
                {t: "14:30-16:00", n: "Языки программирования (Лек)"}
            ]},
            6: { name: "Суббота", pairs: [
                {t: "10:40-12:10", n: "Физкультура (Пр)"},
                {t: "12:20-13:50", n: "Базы данных (Лек)"},
                {t: "14:30-16:00", n: "Сети и системы передачи (Лек)"}
            ]},
            0: { name: "Воскресенье", pairs: [{t: "00:00-23:59", n: "Выходной 😇"}] }
        };

        function unlock() {
            if(document.getElementById('pass').value === '190407') {
                document.getElementById('password-screen').style.display = 'none';
                document.getElementById('main-ui').style.display = 'flex';
                initDashboard();
            } else { alert('Доступ закрыт!'); }
        }

        function initDashboard() {
            const now = new Date();
            const day = now.getDay();
            const config = fullSchedule[day];
            
            document.getElementById('display-day').innerText = config.name;
            const list = document.getElementById('schedule-list');
            list.innerHTML = "";

            config.pairs.forEach(p => {
                const item = document.createElement('div');
                item.className = 'sch-item';
                
                // Проверка текущей пары
                const [start, end] = p.t.split('-');
                if (isCurrent(start, end)) item.classList.add('current-para');

                item.innerHTML = `<span>${p.n}</span><span class="time-label">${p.t}</span>`;
                list.appendChild(item);
            });

            // Таймер сессии
            setInterval(() => {
                const diff = new Date('June 1, 2026') - new Date();
                const d = Math.floor(diff / (1000*60*60*24));
                const m = Math.floor(d / 30.44);
                document.getElementById('timer').innerText = `${m} мес. ${d % 30} дн.`;
            }, 1000);
        }

        function isCurrent(start, end) {
            const now = new Date();
            const cur = now.getHours() * 60 + now.getMinutes();
            const [sH, sM] = start.split(':').map(Number);
            const [eH, eM] = end.split(':').map(Number);
            return cur >= (sH * 60 + sM) && cur <= (eH * 60 + eM);
        }

        document.getElementById('pass').addEventListener('keypress', (e) => e.key==='Enter' && unlock());
    </script>
</body>
</html>
