<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polytech OS | Emerald Edition</title>
    <style>
        :root {
            /* Изумрудная палитра */
            --bg: radial-gradient(circle at center, #064e3b 0%, #022c22 100%);
            --card-bg: rgba(6, 78, 59, 0.45);
            --accent: #10b981; 
            --text: #e6edf3;
            --yellow: #fbbf24;
            --sidebar-bg: #022c22;
            --today-border: #fbbf24;
        }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); background-attachment: fixed; color: var(--text); min-height: 100vh; display: flex; }
        
        #password-screen { position: fixed; inset: 0; background: #022c22; display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .login-box { background: var(--card-bg); padding: 40px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); text-align: center; width: 280px; backdrop-filter: blur(10px); }
        
        #main-ui { display: none; width: 100%; flex-direction: row; }
        .sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid rgba(255,255,255,0.05); padding: 30px 20px; flex-shrink: 0; }
        .dashboard { flex: 1; padding: 30px; overflow-y: auto; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .glass-card { background: var(--card-bg); border-radius: 20px; padding: 25px; border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); }
        .full-width { grid-column: 1 / -1; }

        .tag { font-size: 11px; text-transform: uppercase; color: var(--accent); font-weight: bold; letter-spacing: 1px; margin-bottom: 10px; display: block; }
        
        .week-container { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; }
        .day-column { min-width: 200px; background: rgba(255,255,255,0.02); padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .day-column.today { border: 1px solid var(--today-border); background: rgba(251, 191, 36, 0.05); }
        
        .day-name { color: var(--yellow); font-weight: bold; margin-bottom: 10px; display: block; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sch-item { display: flex; justify-content: space-between; padding: 8px; border-radius: 8px; margin-bottom: 5px; font-size: 11px; background: rgba(255,255,255,0.03); }

        .progress-track { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin: 10px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: 0.8s; }
        
        .btn-action { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: 600; margin-top: 10px; }
        input { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box; font-size: 16px; margin-bottom: 10px; }

        @media (max-width: 768px) { #main-ui { flex-direction: column; } .sidebar { width: 100%; } .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div id="password-screen">
    <div class="login-box">
        <h2 style="color: var(--accent)">Polytech OS</h2>
        <input type="password" id="pass" placeholder="Код доступа" inputmode="numeric">
        <button class="btn-action" onclick="unlock()">Войти</button>
    </div>
</div>

<div id="main-ui">
    <aside class="sidebar">
        <div class="tag">University</div>
        <h2 style="margin: 5px 0">Политех <span style="color:var(--accent)">ИТ</span></h2>
        <p style="font-size: 12px; opacity: 0.6; margin-top: 20px;">Группа 251-952<br>Статус: Работает</p>
    </aside>

    <main class="dashboard">
        <div class="grid">
            <div class="glass-card full-width">
                <span class="tag">Расписание</span>
                <div class="week-container" id="week-schedule"></div>
            </div>

            <div class="glass-card">
                <span class="tag">Задачи</span>
                <h3 style="margin:0">Прогресс (<span id="perc-val">0</span>%)</h3>
                <div class="progress-track"><div class="progress-bar" id="fill"></div></div>
                <div id="task-list" style="max-height: 150px; overflow-y: auto; margin-top: 10px;"></div>
                <button class="btn-action" onclick="addTask()">+ Добавить</button>
            </div>

            <div class="glass-card" style="display: flex; align-items: center; justify-content: center; text-align: center;">
                <div>
                    <span class="tag">Сервисы</span>
                    <a href="https://lk.mospolytech.ru" target="_blank" style="text-decoration:none;"><button class="btn-action">Личный кабинет</button></a>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    const weekData = {
        1: { n: "Пн", p: [{t: "12:20-13:50", n: "Проектная деят. (Пр)"}] },
        2: { n: "Вт", p: [{t: "09:00-10:30", n: "Языки прогр. (Лаб)"},{t: "10:40-12:10", n: "Языки прогр. (Лаб)"},{t: "12:20-13:50", n: "Иностр. язык (Пр)"}] },
        3: { n: "Ср", p: [{t: "09:00-10:30", n: "Мат. анализ (Лек)"},{t: "10:40-12:10", n: "Теор. вероятн. (Пр)"},{t: "12:20-13:50", n: "Мат. анализ (Пр)"}] },
        4: { n: "Чт", p: [{t: "10:40-12:10", n: "Технол. прогр. (Лаб)"},{t: "12:20-13:50", n: "Сети / БД (Лаб)"},{t: "14:30-16:00", n: "Сети / БД (Лаб)"}] },
        5: { n: "Пт", p: [{t: "09:00-10:30", n: "Технол. прогр. (Лек)"},{t: "10:40-12:10", n: "Тех. тексты (Лек)"},{t: "12:20-13:50", n: "Теор. вероятн. (Лек)"},{t: "14:30-16:00", n: "Языки прогр. (Лек)"}] },
        6: { n: "Сб", p: [{t: "10:40-12:10", n: "Физкультура (Пр)"},{t: "12:20-13:50", n: "Базы данных (Лек)"},{t: "14:30-16:00", n: "Сети и системы (Лек)"}] }
    };

    const _0xHASH = "MTkwNDA3"; 

    function unlock() {
        if(document.getElementById('pass').value === atob(_0xHASH)) {
            document.getElementById('password-screen').style.display = 'none';
            document.getElementById('main-ui').style.display = 'flex';
            init();
            showCurrentLessonAlert(); // Всплывающее уведомление
        } else { alert('Ошибка доступа'); }
    }

    function init() {
        renderSchedule();
        renderTasks();
    }

    function showCurrentLessonAlert() {
        const now = new Date();
        const day = now.getDay();
        const curMins = now.getHours() * 60 + now.getMinutes();
        let lessonName = "Сейчас пар нет";

        if (weekData[day]) {
            weekData[day].p.forEach(p => {
                const [start, end] = p.t.split('-');
                const [sH, sM] = start.split(':').map(Number);
                const [eH, eM] = end.split(':').map(Number);
                if (curMins >= (sH*60+sM) && curMins <= (eH*60+eM)) {
                    lessonName = "Текущая пара: " + p.n;
                }
            });
        }
        alert(lessonName);
    }

    function renderSchedule() {
        const container = document.getElementById('week-schedule');
        const today = new Date().getDay();
        for (let d in weekData) {
            let html = `<div class="day-column ${d == today ? 'today' : ''}"><span class="day-name">${weekData[d].n}</span>`;
            weekData[d].p.forEach(p => {
                html += `<div class="sch-item"><span>${p.n}</span><span style="opacity:0.5">${p.t}</span></div>`;
            });
            container.innerHTML += html + `</div>`;
        }
    }

    // Задачи
    let tasks = JSON.parse(localStorage.getItem('tasks_em') || '[]');
    function addTask() {
        const t = prompt("Задача:");
        if(t) { tasks.push({text: t, done: false}); save(); }
    }
    function save() { localStorage.setItem('tasks_em', JSON.stringify(tasks)); renderTasks(); }
    function renderTasks() {
        const list = document.getElementById('task-list');
        list.innerHTML = '';
        let dCount = 0;
        tasks.forEach((t, i) => {
            if(t.done) dCount++;
            list.innerHTML += `<div class="sch-item" onclick="tasks[${i}].done=!tasks[${i}].done; save()" style="cursor:pointer; ${t.done ? 'opacity:0.4;text-decoration:line-through':'' }">${t.text}</div>`;
        });
        const p = tasks.length ? Math.round(dCount/tasks.length*100) : 0;
        document.getElementById('fill').style.width = p+'%';
        document.getElementById('perc-val').innerText = p;
    }
</script>
</body>
</html>
